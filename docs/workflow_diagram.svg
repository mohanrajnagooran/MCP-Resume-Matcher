<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <style>
      .node{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}
      .nt{font-size:15px;font-weight:600;fill:#1e1b4b}
      .ns{font-size:11.5px;fill:#6b7280}
      .call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
      .fs{fill:#1d4ed8}.db{fill:#047857}.loc{fill:#6b7280}
      .edge{stroke:#475569;stroke-width:1.6;fill:none}
      .cond{stroke:#475569;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .lbl{font-size:11px;fill:#334155}
      .h{font-size:20px;font-weight:700;fill:#0f172a}
      .sub{font-size:12.5px;fill:#64748b}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .bt{font-size:15px;font-weight:700}
      .li{font-size:12.5px;fill:#334155}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#334155}
      .sec{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#64748b}
    </style>
  </defs>
  <rect width="1500" height="1010" fill="#ffffff"/>

  <!-- ======================= LEFT: LangGraph state machine ======================= -->
  <text x="30" y="40" class="h">Agent ↔ MCP workflow</text>
  <text x="30" y="62" class="sub">matching_agent.py (LangGraph StateGraph) · every file and database access is an MCP tool call</text>

  <circle cx="265" cy="98" r="11" fill="#0f172a"/>
  <text x="285" y="102" class="lbl">START</text>
  <line x1="265" y1="109" x2="265" y2="128" class="edge" marker-end="url(#a)"/>

  <!-- nodes: y = 130 + i*78 -->
  <g>
    <rect x="120" y="130" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="153" class="nt">1 · discover_capabilities</text>
    <text x="135" y="171" class="ns">inventory of both servers, verify tools</text>

    <rect x="120" y="208" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="231" class="nt">2 · load_job</text>
    <text x="135" y="249" class="ns">job text → required / nice-to-have skills</text>

    <rect x="120" y="286" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="309" class="nt">3 · discover_resumes</text>
    <text x="135" y="327" class="ns">start watch (if --watch), list files</text>

    <rect x="120" y="364" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="387" class="nt">4 · extract_resumes</text>
    <text x="135" y="405" class="ns">parallel text extraction, per-file errors</text>

    <rect x="120" y="442" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="465" class="nt">5 · parse_candidates</text>
    <text x="135" y="483" class="ns">name, email, years, skills, degree</text>

    <rect x="120" y="520" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="543" class="nt">6 · lookup_history</text>
    <text x="135" y="561" class="ns">returning applicants, previous scores</text>

    <rect x="120" y="598" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="621" class="nt">7 · score_candidates</text>
    <text x="135" y="639" class="ns">55 req · 20 nice · 20 exp · 5 edu</text>

    <rect x="120" y="676" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="699" class="nt">8 · persist_results</text>
    <text x="135" y="717" class="ns">store candidates and match scores</text>

    <rect x="120" y="754" width="290" height="52" rx="10" class="node"/>
    <text x="135" y="777" class="nt">9 · write_report</text>
    <text x="135" y="795" class="ns">ranked JSON + Markdown report</text>

    <rect x="120" y="832" width="290" height="52" rx="10" class="node" style="fill:#fff7ed;stroke:#d97706"/>
    <text x="135" y="855" class="nt">10 · wait_for_resumes</text>
    <text x="135" y="873" class="ns">long-poll the watch for new files</text>
  </g>

  <!-- straight edges -->
  <line x1="265" y1="182" x2="265" y2="206" class="edge" marker-end="url(#a)"/>
  <line x1="265" y1="260" x2="265" y2="284" class="edge" marker-end="url(#a)"/>
  <line x1="265" y1="338" x2="265" y2="362" class="cond" marker-end="url(#a)"/>
  <text x="272" y="355" class="lbl">files found</text>
  <line x1="265" y1="416" x2="265" y2="440" class="edge" marker-end="url(#a)"/>
  <line x1="265" y1="494" x2="265" y2="518" class="cond" marker-end="url(#a)"/>
  <text x="272" y="511" class="lbl">DB connected</text>
  <line x1="265" y1="572" x2="265" y2="596" class="edge" marker-end="url(#a)"/>
  <line x1="265" y1="650" x2="265" y2="674" class="cond" marker-end="url(#a)"/>
  <text x="272" y="667" class="lbl">DB connected</text>
  <line x1="265" y1="728" x2="265" y2="752" class="edge" marker-end="url(#a)"/>
  <line x1="265" y1="806" x2="265" y2="830" class="cond" style="stroke:#d97706" marker-end="url(#ao)"/>
  <text x="272" y="823" class="lbl" style="fill:#b45309">--watch and time left</text>

  <!-- END -->
  <circle cx="265" cy="950" r="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="265" cy="950" r="7" fill="#0f172a"/>
  <text x="245" y="954" class="lbl" text-anchor="end">END</text>
  <line x1="265" y1="884" x2="265" y2="935" class="cond" marker-end="url(#a)"/>
  <text x="272" y="913" class="lbl">window closed, no new files</text>

  <!-- left-side skip lanes -->
  <path d="M120,468 H98 V624 H118" class="cond" marker-end="url(#a)"/>
  <text x="52" y="550" class="lbl" text-anchor="end">no DB:</text>
  <text x="52" y="564" class="lbl" text-anchor="end">skip 6</text>
  <path d="M120,630 H80 V780 H118" class="cond" marker-end="url(#a)"/>
  <text x="52" y="705" class="lbl" text-anchor="end">no DB:</text>
  <text x="52" y="719" class="lbl" text-anchor="end">skip 8</text>
  <path d="M120,312 H58 V770 H118" class="cond" marker-end="url(#a)"/>
  <text x="52" y="400" class="lbl" text-anchor="end">no files</text>
  <text x="52" y="414" class="lbl" text-anchor="end">(→10 if</text>
  <text x="52" y="428" class="lbl" text-anchor="end">--watch)</text>

  <!-- right-side lanes: loop and write_report -> END -->
  <path d="M410,858 H446 V390 H412" class="cond" style="stroke:#d97706" marker-end="url(#ao)"/>
  <text x="452" y="640" class="lbl" style="fill:#b45309" transform="rotate(-90 452 640)">new resume(s) arrived → loop to 4</text>
  <path d="M410,788 H428 V950 H279" class="cond" marker-end="url(#a)"/>
  <text x="340" y="964" class="lbl">batch run</text>

  <!-- MCP calls per node -->
  <g class="call">
    <text x="478" y="152" class="fs">filesystem → server/discover</text>
    <text x="478" y="169" class="db">candidate_db → server/discover</text>
    <text x="478" y="230" class="fs">filesystem.extract_text</text>
    <text x="478" y="247" class="db">candidate_db.start_run</text>
    <text x="478" y="308" class="fs">filesystem.watch_directory(start)</text>
    <text x="478" y="325" class="fs">filesystem.list_files</text>
    <text x="478" y="386" class="fs">filesystem.batch_process</text>
    <text x="478" y="403" class="fs" style="font-size:11px">  ⇠ notifications/progress</text>
    <text x="478" y="472" class="loc">local (no I/O)</text>
    <text x="478" y="550" class="db">candidate_db.candidate_history</text>
    <text x="478" y="628" class="loc">local (no I/O)</text>
    <text x="478" y="698" class="db">candidate_db.upsert_candidate</text>
    <text x="478" y="715" class="db">candidate_db.record_matches</text>
    <text x="478" y="776" class="fs">filesystem.write_file ×2</text>
    <text x="478" y="793" class="db">candidate_db.finish_run</text>
    <text x="478" y="854" class="fs">filesystem.watch_directory(poll)</text>
    <text x="478" y="871" class="fs" style="font-size:11px">  ⇠ notifications/message</text>
  </g>

  <!-- divider -->
  <line x1="790" y1="85" x2="790" y2="975" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ======================= RIGHT: MCP architecture ======================= -->
  <text x="820" y="102" class="sec">CLIENT SIDE</text>
  <rect x="820" y="112" width="650" height="108" rx="12" class="box" style="stroke:#7c3aed"/>
  <text x="840" y="140" class="bt" style="fill:#4c1d95">MultiMCPClient · mcp_client.py</text>
  <text x="840" y="163" class="li">Reads config/mcp_servers.json (the standard “mcpServers” format), spawns each server,</text>
  <text x="840" y="182" class="li">runs initialize → notifications/initialized, routes “server.tool” calls, matches responses by id,</text>
  <text x="840" y="201" class="li">delivers progress + notifications to callbacks, and adapts MCP tools to LangChain tools.</text>

  <!-- pipes -->
  <line x1="980" y1="222" x2="980" y2="298" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="1000" y1="298" x2="1000" y2="222" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <line x1="1310" y1="222" x2="1310" y2="298" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="1330" y1="298" x2="1330" y2="222" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <rect x="1032" y="241" width="236" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1150" y="258" class="mono" text-anchor="middle">JSON-RPC 2.0 · newline-delimited</text>
  <text x="1150" y="274" class="mono" text-anchor="middle">stdin / stdout (subprocess)</text>
  <text x="1012" y="236" class="lbl" style="fill:#2563eb">responses +</text>
  <text x="1012" y="292" class="lbl" style="fill:#2563eb">notifications</text>

  <text x="820" y="318" class="sec">SERVER SIDE</text>
  <!-- filesystem server -->
  <rect x="820" y="300" width="340" height="485" rx="12" class="box" style="stroke:#2563eb;stroke-width:1.6"/>
  <rect x="820" y="300" width="340" height="44" rx="12" fill="#eff6ff"/>
  <rect x="820" y="330" width="340" height="14" fill="#eff6ff"/>
  <text x="838" y="328" class="bt" style="fill:#1d4ed8">filesystem_mcp_server.py</text>
  <text x="838" y="368" class="sec">TOOLS (11)</text>
  <text x="838" y="388" class="mono">list_roots · list_files · read_file</text>
  <text x="838" y="405" class="mono">extract_text · get_file_metadata</text>
  <text x="838" y="422" class="mono">search_files · write_file</text>
  <text x="838" y="442" class="mono" style="fill:#b45309;font-weight:700">★ watch_directory  ★ batch_process</text>
  <text x="838" y="459" class="mono">get_server_config · configure_server</text>
  <text x="838" y="490" class="sec">RESOURCES + TEMPLATES</text>
  <text x="838" y="510" class="mono">fs://{root}/{path}   fs-meta://{root}/{path}</text>
  <text x="838" y="527" class="mono">tools://catalog      tools://{name}</text>
  <text x="838" y="544" class="mono">config://server      watch://{id}/events</text>
  <text x="838" y="575" class="sec">DISCOVERY &amp; ERRORS</text>
  <text x="838" y="595" class="li">initialize caps · */list · server/discover</text>
  <text x="838" y="613" class="li">-32700 … -32603 · -32001 ACCESS_DENIED …</text>
  <text x="838" y="631" class="li">tool failures → isError: true + error object</text>
  <text x="838" y="662" class="sec">INSIDE</text>
  <text x="838" y="682" class="li">Sandbox resolver (roots, no ../, no symlink escape)</text>
  <text x="838" y="700" class="li">ThreadPool batches · extraction cache</text>
  <text x="838" y="718" class="li">DirectoryWatcher threads (settle detection)</text>
  <text x="838" y="736" class="li">Config: JSON file &lt; env vars &lt; configure_server</text>
  <text x="838" y="764" class="mono" style="fill:#64748b">--transport stdio | http (POST /mcp)</text>

  <!-- db server -->
  <rect x="1180" y="300" width="290" height="330" rx="12" class="box" style="stroke:#059669;stroke-width:1.6"/>
  <rect x="1180" y="300" width="290" height="44" rx="12" fill="#ecfdf5"/>
  <rect x="1180" y="330" width="290" height="14" fill="#ecfdf5"/>
  <text x="1198" y="328" class="bt" style="fill:#047857">database_mcp_server.py</text>
  <text x="1198" y="368" class="sec">TOOLS (8) · BONUS SERVER</text>
  <text x="1198" y="388" class="mono">candidate_history</text>
  <text x="1198" y="405" class="mono">upsert_candidate</text>
  <text x="1198" y="422" class="mono">start_run · record_matches</text>
  <text x="1198" y="439" class="mono">finish_run · top_matches</text>
  <text x="1198" y="456" class="mono">search_candidates</text>
  <text x="1198" y="473" class="mono">run_sql (read-only)</text>
  <text x="1198" y="504" class="sec">RESOURCES</text>
  <text x="1198" y="524" class="mono">db://schema · db://stats</text>
  <text x="1198" y="541" class="mono">db://runs · db://runs/{run_id}</text>
  <text x="1198" y="572" class="li">Same protocol core as the</text>
  <text x="1198" y="590" class="li">filesystem server (shared</text>
  <text x="1198" y="608" class="li">MCPServer base class)</text>

  <!-- storage -->
  <line x1="990" y1="785" x2="990" y2="818" class="edge" marker-end="url(#a)"/>
  <rect x="820" y="820" width="340" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="838" y="846" class="bt" style="fill:#334155;font-size:14px">Sandboxed folders</text>
  <text x="838" y="868" class="mono">data/resumes/  (read-only, watched)</text>
  <text x="838" y="885" class="mono">data/jobs/     (read-only)</text>
  <text x="838" y="902" class="mono">output/        (writable reports)</text>

  <line x1="1325" y1="630" x2="1325" y2="663" class="edge" marker-end="url(#a)"/>
  <rect x="1180" y="665" width="290" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="1198" y="691" class="bt" style="fill:#334155;font-size:14px">SQLite</text>
  <text x="1198" y="711" class="mono">data/candidates.db</text>

  <rect x="1180" y="760" width="290" height="146" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1198" y="785" class="bt" style="fill:#92400e;font-size:14px">New resume arrives</text>
  <text x="1198" y="806" class="li">1. watcher sees file, waits until</text>
  <text x="1198" y="823" class="li">    size/mtime settle</text>
  <text x="1198" y="840" class="li">2. pushes resources/list_changed</text>
  <text x="1198" y="857" class="li">    + notifications/message</text>
  <text x="1198" y="874" class="li">3. agent's poll returns the event</text>
  <text x="1198" y="891" class="li">4. graph loops: node 10 → node 4</text>

  <!-- legend -->
  <g transform="translate(30,985)">
    <rect x="0" y="-11" width="12" height="12" rx="2" fill="#1d4ed8"/><text x="18" y="0" class="lbl">filesystem MCP call</text>
    <rect x="150" y="-11" width="12" height="12" rx="2" fill="#047857"/><text x="168" y="0" class="lbl">candidate_db MCP call</text>
    <line x1="320" y1="-5" x2="350" y2="-5" class="edge"/><text x="356" y="0" class="lbl">fixed edge</text>
    <line x1="440" y1="-5" x2="470" y2="-5" class="cond"/><text x="476" y="0" class="lbl">conditional edge (router function)</text>
    <line x1="690" y1="-5" x2="720" y2="-5" class="cond" style="stroke:#d97706"/><text x="726" y="0" class="lbl">watch loop</text>
  </g>
</svg>
